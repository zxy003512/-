<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>!!! 系统核心警报 !!!</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #00ff41;
            --danger-color: #ff004f;
            --accent-color: #f7b219;
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: none; /* 全程隐藏鼠标指针 */
        }

        /* 开始遮罩层 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            cursor: pointer;
            flex-direction: column;
        }

        /* --- 以下是针对“引导点击”文字的修改 --- */
        #start-overlay p {
            font-size: 2.8em; /* 大幅增加主标题字号 */
            color: #ddd; /* 修改为非常亮的灰色，确保可见性 */
            text-shadow: 0 0 10px rgba(221, 221, 221, 0.6); /* 添加辉光效果，使其在黑色背景上更突出 */
            animation: flicker 2.5s infinite;
            margin: 0; /* 移除默认段落边距 */
            padding: 0 20px; /* 在小屏幕上增加内边距，防止文字紧贴边缘 */
            text-align: center; /* 保证文字居中 */
        }
        #start-overlay p.small {
            font-size: 1.2em; /* 相应增加副标题字号 */
            color: #999; /* 副标题也使用更亮的灰色 */
            margin-top: 25px; /* 增加与主标题的间距 */
            text-shadow: none; /* 副标题不需要辉光效果 */
        }
        /* --- 修改结束 --- */


        /* 入侵主屏幕 */
        #breach-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column;
            opacity: 0; /* 默认隐藏 */
            transition: opacity 0.8s ease-out; /* 修改：增加平滑过渡效果 */
        }

        .terminal-header {
            width: 100%; text-align: center; color: var(--danger-color);
            font-size: 1.4em; /* 修改：增大标题字号 */
            padding-bottom: 10px; border-bottom: 1px solid #333;
            margin-bottom: 10px; animation: flicker 2s infinite;
        }

        #terminal-log {
            flex-grow: 1; overflow-y: auto;
            /* 修改：增大终端日志字号和间距，更清晰 */
            font-size: 1.1em;
            line-height: 1.7; 
            letter-spacing: 1px;
            scrollbar-width: none; /* Firefox */
        }
        #terminal-log::-webkit-scrollbar { display: none; } /* Chrome, Safari */

        #terminal-log div { margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
        .ok { color: var(--text-color); }
        .warn { color: var(--accent-color); }
        /* 修改：让危险提示更醒目 */
        .danger { 
            color: var(--danger-color); 
            font-weight: bold; 
            font-size: 1.1em;
        }
        .section { color: #fff; margin-top: 15px; text-decoration: underline; }
        
        /* 修改：特别高亮的危险提示，使其更具冲击力 */
        .highlight-danger {
            background-color: var(--danger-color);
            color: white;
            padding: 8px;
            margin: 8px -15px; /* 撑满左右宽度 */
            display: block;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            animation: pulse 0.8s infinite;
            letter-spacing: 2px;
        }

        /* 最终信息面板 */
        #final-message {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 600px;
            background: rgba(255, 0, 79, 0.15);
            border: 3px solid var(--danger-color); border-radius: 10px;
            padding: 30px 40px; text-align: center; box-sizing: border-box;
            box-shadow: 0 0 40px var(--danger-color), inset 0 0 20px rgba(255, 0, 79, 0.5);
            display: none; 
            z-index: 20; /* 确保在最上层 */
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        /* 修改：修复标题文字重叠问题，并调整样式 */
        #final-message h2 {
            color: var(--danger-color);
            margin: 0;
            font-size: 2.2em; /* 调整字号以适应容器 */
            line-height: 1.3;  /* 关键：增加行高防止重叠 */
            text-shadow: 0 0 10px var(--danger-color);
            animation: flicker 1.5s infinite;
        }
        #final-message p {
            color: #fff;
            margin: 15px 0 0;
            font-size: 1.3em; /* 增大副标题字号 */
        }

        /* 揭秘屏幕 */
        #reveal-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fdf6f6;
            display: flex; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
            opacity: 0; visibility: hidden; transition: opacity 1s ease-in, visibility 1s;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            cursor: default; /* 恢复鼠标指针 */
        }
        .reveal-content {
            transform: translateY(20px); transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reveal-content h1 { font-size: 2.8em; color: #e85a71; margin: 0; }
        .reveal-content p { font-size: 1.1em; color: #555; line-height: 1.8; margin-top: 20px; }
        .reveal-content .highlight { color: #e85a71; font-weight: bold; }
        .reveal-content .signature { margin-top: 30px; font-size: 1em; color: #888; }
        .reveal-content .emoji { font-size: 3em; display: block; margin-top: 15px; animation: gentle-bounce 2.5s infinite; }

        /* 动画 */
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 10px var(--danger-color); } 50% { transform: scale(1.02); box-shadow: 0 0 25px var(--danger-color); } 100% { transform: scale(1); box-shadow: 0 0 10px var(--danger-color); } }
        @keyframes gentle-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    </style>
</head>
<body>

    <div id="start-overlay">
        <p>屏幕控制器损坏</p>
        <p class="small">随便点击屏幕进行修复</p>
    </div>

    <div id="breach-screen">
        <div class="terminal-header">[CRITICAL_SYSTEM_FAILURE] - [REMOTE_ACCESS_GRANTED]</div>
        <div id="terminal-log"></div>
    </div>

    <div id="final-message">
        <h2>你的所有数据获取完毕</h2>
        <p>感谢你的钱</p>
    </div>

    <div id="reveal-screen">
        <div class="reveal-content">
            <span class="emoji">🥰</span>
            <h1>别怕，这是假的！</h1>
            <p>刚才是不是心跳都加速了？<br>别担心，这只是一个网页特效，你的设备安全得很。</p>
            <p>但这也提醒我们，<span class="highlight">网络世界里的一条陌生链接，可能真的会带来无法想象的后果。</span></p>
            <p>以后一定要小心，不要再乱点链接啦！</p>
            <div class="signature">—— ❤️</div>
        </div>
    </div>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const logEl = document.getElementById('terminal-log');
        const breachScreen = document.getElementById('breach-screen');
        const finalMessage = document.getElementById('final-message');
        const revealScreen = document.getElementById('reveal-screen');
        const revealContent = document.querySelector('.reveal-content');

        const logMessages = [
            { text: "初始化远程连接...", delay: 100 },
            { text: "正在分析设备指纹... [OK]", delay: 300 },
            { text: "检测到开放端口: 443/HTTPS", delay: 200 },
            { text: "<div class='warn'>警告: 系统防火墙存在已知漏洞 CVE-2024-XXXX</div>", delay: 400 },
            { text: "正在利用漏洞... 权限提升...", delay: 500 },
            { text: "<div class='danger'>成功: 已获取 ROOT 权限</div>", delay: 200 },
            { text: "<div class='section'>[开始核心数据提取]</div>", delay: 400 },
            { text: "访问通讯录... [428个联系人已导出]", delay: 300 },
            { text: "访问相册... [正在编译私人照片...]", delay: 500 },
            { text: "AI面部识别已启动... [正在标记关键人物]", delay: 400 },
            { text: "<div class='highlight-danger'>!!! 检测到隐私文件夹，正在深度扫描 !!!</div>", delay: 800 },
            { text: "扫描完成... [分类打包完毕]", delay: 500 },
            { text: "<div class='section warn'>[!!! 高危操作: 正在访问金融与支付应用 !!!]</div>", delay: 500 },
            { text: "支付宝: 正在绕过支付密码...", delay: 600 },
            { text: "<div class='danger'>验证成功: 支付宝控制权已获取</div>", delay: 300 },
            { text: "微信支付: 正在绕过指纹验证...", delay: 600 },
            { text: "<div class='danger'>验证成功: 微信支付控制权已获取</div>", delay: 300 },
            { text: "正在访问所有银行APP...", delay: 500 },
            { text: "<div class='highlight-danger'>!!! 所有金融账户已完全暴露 !!!</div>", delay: 900 },
            { text: "<div class='section'>[执行最终阶段]</div>", delay: 400 },
            { text: "正在对全盘文件进行AES-256加密...", delay: 600 },
            { text: "<div class='danger'>加密完成。数据已无法恢复。</div>", delay: 300 },
        ];

        function enterFullScreen(element) {
            if (element.requestFullscreen) {
                element.requestFullscreen().catch(err => console.log(err));
            } else if (element.mozRequestFullScreen) { /* Firefox */
                element.mozRequestFullScreen();
            } else if (element.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) { /* IE/Edge */
                element.msRequestFullscreen();
            }
        }

        function startSequence() {
            startOverlay.style.display = 'none';
            breachScreen.style.opacity = '1';

            document.addEventListener('click', e => {
                e.preventDefault();
            }, true);

            processLogs();
        }

        let i = 0;
        function processLogs() {
            if (i < logMessages.length) {
                const log = logMessages[i];
                const div = document.createElement('div');
                div.innerHTML = log.text;
                logEl.appendChild(div);
                logEl.scrollTop = logEl.scrollHeight;
                i++;
                setTimeout(processLogs, log.delay);
            } else {
                setTimeout(showFinalMessage, 1000);
            }
        }

        function showFinalMessage() {
            // 修改：淡出背景终端，突出最终信息
            breachScreen.style.opacity = '0.1'; 
            
            finalMessage.style.display = 'block';
            setTimeout(() => { // 加一个小延迟让display生效再改opacity，以触发过渡
                finalMessage.style.opacity = '1';
            }, 50);
            
            setTimeout(showReveal, 5000);
        }

        function showReveal() {
            finalMessage.style.opacity = '0';

            setTimeout(() => {
                breachScreen.style.display = 'none'; // 可以彻底隐藏
                finalMessage.style.display = 'none';
                revealScreen.style.visibility = 'visible';
                revealScreen.style.opacity = '1';
                revealContent.style.transform = 'translateY(0)';
            }, 1000);
        }
        
        startOverlay.addEventListener('click', () => {
            enterFullScreen(document.documentElement);
            startSequence();
        }, { once: true });

    </script>
</body>
</html>
